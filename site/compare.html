<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..750&family=Martian+Mono:wdth,wght@75..112.5,400..500&display=swap" rel="stylesheet">
<style>
/* Two interactive live sites, with independent scrolling. */
:root { color-scheme: dark; --ink: #141115; --ink-2: #1c181d; --ink-3: #252027; --line: #2e2930; --paper: #f2f0f3; --mute: #b9b2be; --dim: #857d8a; --volt: #c0f63c; --salmon: #ee9070;
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; --mono: "Martian Mono", ui-monospace, monospace; --top: 144px; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--paper); font: 400 15px/1.5 var(--display); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }

header { position: fixed; z-index: 10; inset: 0 0 auto; background: rgb(20 17 21 / 0.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.row1, .row2 { display: flex; align-items: center; gap: 12px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right)); }
.row1 { height: 56px; }
.row2 { height: 48px; border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.row2::-webkit-scrollbar { display: none; }
.back { color: var(--dim); font: 500 13px/1 var(--display); white-space: nowrap; }
.back:hover { color: var(--paper); }
.sep { width: 1px; height: 20px; background: var(--line); flex: none; }
.picker { position: relative; }
.picker select { appearance: none; -webkit-appearance: none; background: var(--ink-2); border: 1px solid var(--line); color: var(--paper); height: 36px; padding: 0 36px 0 12px; font: 650 16px/1 var(--display); font-stretch: 85%; letter-spacing: -0.01em; cursor: pointer; border-radius: 0; }
.picker::after { content: "▾"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; font-size: 12px; }
.from { color: var(--dim); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.from b { color: var(--mute); font-weight: 500; }
.grow { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; font: 500 13px/1 var(--display); color: var(--mute); box-shadow: inset 0 0 0 1px var(--line); background: none; border: 0; cursor: pointer; white-space: nowrap; }
.btn:hover, .btn[aria-pressed="true"] { color: var(--ink); background: var(--paper); box-shadow: none; }
.score { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; flex: none; }
.score b { font: 700 22px/1 var(--display); font-stretch: 80%; color: var(--volt); }
.score span { font: 500 11px/1 var(--mono); font-stretch: 87.5%; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
.score.no b { color: var(--salmon); }
.dims { display: flex; gap: 6px; flex: none; }
.dim { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; background: var(--ink-2); font: 500 12px/1 var(--display); color: var(--mute); white-space: nowrap; }
.dim i { font-style: normal; font: 500 11px/1 var(--mono); font-stretch: 87.5%; color: var(--paper); }
.dim.low i { color: var(--salmon); }
@media (max-width: 760px) { .from, .row1 .btn.open { display: none; } }
.live-note { margin: 0; padding: 9px 20px; border-top: 1px solid var(--line); color: var(--mute); font-size: 12px; }

.view { position: fixed; inset: var(--top) 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
.col { position: relative; overflow: hidden; background: #fff; display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.col iframe { width: 100%; height: 100%; min-height: 0; border: 0; display: block; background: #fff; }
.cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; background: var(--ink-2); font: 500 12px/1.3 var(--display); color: var(--mute); }
.cap b { color: var(--paper); font-weight: 600; }
.cap a { flex: none; text-decoration: underline; text-underline-offset: 3px; }
.cap a:hover { color: var(--paper); }
.rec .cap b { color: var(--volt); }
@media (max-width: 560px) { .cap { padding: 10px 8px; flex-wrap: wrap; } .cap b { width: 100%; overflow: hidden; text-overflow: ellipsis; } }

.motion { position: fixed; z-index: 12; left: 50%; bottom: 16px; transform: translate(-50%, 140%); width: min(1100px, calc(100vw - 32px)); background: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgb(0 0 0 / 0.6); padding: 14px; display: grid; gap: 12px; transition: transform 500ms cubic-bezier(0.19, 1, 0.22, 1); }
.motion.on { transform: translate(-50%, 0); }
.motion .vids { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.motion video { width: 100%; aspect-ratio: 16 / 10; background: #000; display: block; }
.motion .bar { display: flex; align-items: center; gap: 12px; color: var(--mute); font: 400 13px/1.3 var(--display); }
.motion .bar .grow { flex: 1; }
.motion input { flex: 1; accent-color: var(--volt); }
</style>
</head>
<body>
<header>
  <div class="row1">
    <a class="back" href="./#catalog">← relume</a>
    <span class="sep"></span>
    <label class="picker"><span class="sr" hidden>Recreation</span><select id="pick" aria-label="Recreation"></select></label>
    <span class="from" id="from"></span>
    <span class="grow"></span>
    <a class="btn open" id="openSrc" target="_blank" rel="noopener">Original ↗</a>
    <a class="btn open" id="openRec" target="_blank" rel="noopener">Recreation ↗</a>
  </div>
  <div class="row2">
    <div class="score" id="score"></div>
    <span class="sep"></span>
    <div class="dims" id="dims"></div>
    <span class="grow"></span>
    <button class="btn" id="motionBtn" type="button" aria-pressed="false">Watch motion</button>
  </div>
  <p class="live-note">Live sites · Scroll and interact with each page independently. If a site blocks embedding, use its “Open site” link.</p>
</header>

<main class="view" aria-label="Live site comparison">
  <section class="col src" aria-label="Reference site"><div class="cap"><b id="tagA"></b><a id="frameOpenSrc" target="_blank" rel="noopener">Open site ↗</a></div><iframe id="siteA" title="Live reference site" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" allow="fullscreen"></iframe></section>
  <section class="col rec" aria-label="Recreation site"><div class="cap"><b id="tagB"></b><a id="frameOpenRec" target="_blank" rel="noopener">Open site ↗</a></div><iframe id="siteB" title="Live recreation site" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" allow="fullscreen"></iframe></section>
</main>

<section class="motion" id="motion" aria-label="Motion recordings">
  <div class="bar"><span>Both recorded by relume with the same scripted visit: load, wheel test, scroll pass, hover pass.</span><span class="grow"></span><button class="btn" id="close" type="button">Close</button></div>
  <div class="vids"><video id="vA" muted playsinline preload="metadata"></video><video id="vB" muted playsinline preload="metadata"></video></div>
  <div class="bar"><button class="btn" id="play" type="button">Play</button><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrub both recordings"><span id="t">0.0s</span></div>
</section>

<script type="module">
const data = await fetch('data/compare.json').then((r) => r.json());
const hostOf = (x) => new URL(x.source.url).hostname.replace(/^www\./, '');
const nameOf = (x) => x.name || x.id;
const id = (location.hash || '').slice(1);
const d = data.find((x) => x.id === id) || data[0];
const host = hostOf(d), name = nameOf(d);
document.title = `relume · ${name} from ${host}`;

const pick = document.getElementById('pick');
pick.innerHTML = data.map((x) => `<option value="${x.id}"${x.id === d.id ? ' selected' : ''}>${nameOf(x)}</option>`).join('');
pick.addEventListener('change', () => { location.hash = pick.value; });
addEventListener('hashchange', () => location.reload());
document.getElementById('from').innerHTML = `built from <b>${host}</b>`;

const LABEL = { color: 'colour', type: 'type', spacing: 'spacing', shape: 'shape', layout: 'layout', motion: 'motion', feel: 'feel', composition: 'composition', behaviour: 'behaviour' };
const sc = document.getElementById('score');
sc.className = 'score' + (d.report.pass ? '' : ' no');
sc.innerHTML = `<b>${d.report.overall}</b><span>${d.report.pass ? 'passes' : 'not yet'}</span>`;
document.getElementById('dims').innerHTML = Object.entries(d.report.scores).map(([k, v]) => `<span class="dim${v < 85 ? ' low' : ''}">${LABEL[k] || k}<i>${v}</i></span>`).join('');

document.getElementById('openSrc').href = d.source.page || d.source.url;
const recHref = /^https?:/.test(d.recreationPath) ? d.recreationPath : d.recreationPath.startsWith('/recreations/') ? d.recreationPath.slice(1) : `recreations/${d.recreationPath.replace(/^\//, '')}/`;
document.getElementById('openRec').href = recHref;
document.getElementById('tagA').textContent = host;
document.getElementById('tagB').textContent = name;
const sourceHref = d.source.page || d.source.url;
document.getElementById('frameOpenSrc').href = sourceHref;
document.getElementById('frameOpenRec').href = recHref;
const siteA = document.getElementById('siteA'), siteB = document.getElementById('siteB');
siteA.title = `${host} · live reference site`;
siteB.title = `${name} · live recreation site`;
siteA.src = sourceHref;
siteB.src = recHref;

// The reference is cross-origin, so each live page owns its scrolling and interactions.
const header = document.querySelector('header');
const layout = () => document.documentElement.style.setProperty('--top', `${header.offsetHeight}px`);
new ResizeObserver(layout).observe(header);
layout();

// motion recordings, on request
const panel = document.getElementById('motion'), btn = document.getElementById('motionBtn'), vA = document.getElementById('vA'), vB = document.getElementById('vB');
const play = document.getElementById('play'), scrub = document.getElementById('scrub'), tEl = document.getElementById('t');
const setPanel = (on) => { panel.classList.toggle('on', on); btn.setAttribute('aria-pressed', String(on)); if (on && !vA.src) { vA.src = `media/${d.id}-source.mp4`; vB.src = `media/${d.id}-recreation.mp4`; for (const v of [vA, vB]) v.addEventListener('loadedmetadata', () => { v.currentTime = Math.min(1.5, (v.duration || 2) / 4); }, { once: true }); } if (!on) { vA.pause(); vB.pause(); play.textContent = 'Play'; } };
btn.addEventListener('click', () => setPanel(!panel.classList.contains('on')));
document.getElementById('close').addEventListener('click', () => setPanel(false));
play.addEventListener('click', () => { if (vA.paused) { vA.play(); vB.play(); play.textContent = 'Pause'; } else { vA.pause(); vB.pause(); play.textContent = 'Play'; } });
scrub.addEventListener('input', () => { const t = scrub.value / 1000 * (vA.duration || 0); vA.currentTime = t; vB.currentTime = Math.min(t, Math.max(0, (vB.duration || 0) - 0.05)); });
vA.addEventListener('timeupdate', () => { if (vA.duration) scrub.value = String(Math.round(vA.currentTime / vA.duration * 1000)); tEl.textContent = vA.currentTime.toFixed(1) + 's'; if (!vB.ended && Math.abs(vB.currentTime - vA.currentTime) > 0.3 && vA.currentTime < vB.duration) vB.currentTime = vA.currentTime; });
</script>
</body>
</html>
